<!DOCTYPE html>
<html>
<head><title>Firebase OTP Test</title></head>
<body>
  <h2>Phone OTP Test</h2>
  <input id="phone" placeholder="+919876543210" />
  <button onclick="sendOtp()">Send OTP</button>
  <div id="recaptcha-container"></div>

  <div id="otp-section" style="display:none;">
    <input id="otp" placeholder="Enter OTP" />
    <button onclick="verifyOtp()">Verify OTP</button>
  </div>

  <p id="result"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmc-pMmieov0dF5oarzK00ttYva7HxLpM",
      authDomain: "gym-saas-faf7c.firebaseapp.com",
      projectId: "gym-saas-faf7c",
      storageBucket: "gym-saas-faf7c.firebasestorage.app",
      messagingSenderId: "60757350261",
      appId: "1:60757350261:web:a7925b3e50bea322d5a53c",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.auth = auth;

    window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
      size: "normal",
    });

    window.sendOtp = async function () {
      const phone = document.getElementById("phone").value;
      try {
        window.confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
        document.getElementById("otp-section").style.display = "block";
        document.getElementById("result").innerText = "OTP sent!";
      } catch (err) {
        document.getElementById("result").innerText = "Error: " + err.message;
      }
    };

    window.verifyOtp = async function () {
      const otp = document.getElementById("otp").value;
      try {
        const result = await window.confirmationResult.confirm(otp);
        const idToken = await result.user.getIdToken();

        const res = await fetch("http://localhost:5000/api/otp/verify-firebase-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken }),
        });
        const data = await res.json();
        document.getElementById("result").innerText = JSON.stringify(data);
      } catch (err) {
        document.getElementById("result").innerText = "Error: " + err.message;
      }
    };
  </script>
</body>
</html>
